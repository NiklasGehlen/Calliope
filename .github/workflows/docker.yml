name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

concurrency:
  group: build-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # noetig, damit GITHUB_TOKEN nach GHCR pushen darf

jobs:
  build-prod:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prod
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/niklasgehlen/calliope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-test:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/niklasgehlen/calliope:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
