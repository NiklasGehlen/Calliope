name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

permissions:
  contents: read
  packages: write # noetig, damit GITHUB_TOKEN nach GHCR pushen darf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/niklasgehlen/calliope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
