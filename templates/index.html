<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calliope Remote</title>
    <link rel= "stylesheet" type= "text/css" href= "{{ url_for('static',filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Calliope Remote</h1>
        <div id="status" class="status">
            Nicht verbunden!
        </div>
        <button id="connectBtn">
            Bluetooth verbinden
        </button>
        <button id="selfDriveBtn">
            Selbstfahren: AUS
        </button>
        <div class="speed">
            <button id="turtleBtn" class="speed-btn" title="Langsam (Schildkroete)">
                &#128034;
            </button>
            <button id="rabbitBtn" class="speed-btn" title="Schnell (Hase)">
                &#128007;
            </button>
        </div>
        <div class="pad">
            <button id="upBtn" class="direction">
                &#8593;
            </button>
            <button id="leftBtn" class="direction">
                &#8592;
            </button>
            <button id="rightBtn" class="direction">
                &#8594;
            </button>
            <button id="downBtn" class="direction">
                &#8595;
            </button>
        </div>
        <div class="lifter">
            <div class="lifter-header">
                <span>Heber</span>
                <span id="lifterValue">0&deg;</span>
            </div>
            <div class="lifter-controls">
                <button id="lifterDownBtn" class="lifter-arrow" title="Heber runter">
                    &#8595;
                </button>
                <input id="lifterSlider" class="lifter-slider" type="range" min="0" max="110" step="1"
                    value="0">
                <button id="lifterUpBtn" class="lifter-arrow" title="Heber hoch">
                    &#8593;
                </button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static',filename='js/script.js') }}"></script>
</body>
</html>
